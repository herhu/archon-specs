<body>

      <a class="logo" href="./index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">

      </a>
      <div class="search-container" style="position: relative; display: flex; align-items: center;">
        <svg style="position: absolute; left: 12px; color: var(--muted);" width="16" height="16" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" placeholder="Search changelog..."
          style="background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px 8px 36px; color: var(--text); font-size: 14px; width: 240px; outline: none; transition: var(--transition);">

    <nav class="nav-items">

    </nav>
    <div style="display: flex; align-items: center; gap: 16px;">
      <button id="theme-toggle" class="theme-toggle" title="Toggle theme">
        <svg id="sun-icon" style="display: none;" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg id="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>

      </button>

  </header>
  <div class="main-container">
    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">Years</div>
        <ul class="sidebar-nav">
          <li><a href="#2026" class="active">2026</a></li>
          <li><a href="#2025">2025</a></li>
        </ul>
      </div>
    </aside>
    <main class="content-area">
      <div class="content-wrapper">
        <section id="2026">
          <h1>Changelog</h1>
          <p>The latest updates and improvements to Archon Specs.</p>

          <div id="changelog-container">
            <!-- Dynamic content will be injected here -->
          </div>
        </section>
      </div>
    </main>
  </div>
  <script>
    const themeToggle = document.getElementById('theme-toggle');
    const sunIcon = document.getElementById('sun-icon');
    const moonIcon = document.getElementById('moon-icon');
    const html = document.documentElement;

    themeToggle.addEventListener('click', () => {
      const isDark = html.getAttribute('data-theme') !== 'light';
      if (isDark) {
        html.setAttribute('data-theme', 'light');
        sunIcon.style.display = 'block';
        moonIcon.style.display = 'none';
      } else {
        html.removeAttribute('data-theme');
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'block';
      }
    });

    async function loadChangelog() {
      const container = document.getElementById('changelog-container');
      try {
        const response = await fetch('changelog.json');
        const data = await response.json();

        container.innerHTML = data.map(item => `
          <div class="changelog-item">
            <span class="changelog-date">${item.date}</span>
            <span class="changelog-version">${item.version}</span>
            ${item.changes.map(change => `
              <div>
                <span class="changelog-type type-${change.type.toLowerCase()}">${change.type.charAt(0).toUpperCase() + change.type.slice(1)}</span>
                <h3>${change.title}</h3>
                <p>${change.description}</p>
              </div>
            `).join('')}
          </div>
        `).join('');
      } catch (error) {
        console.error('Error loading changelog:', error);
        container.innerHTML = '<p style="color: var(--muted);">Failed to load changelog data.</p>';
      }
    }

    loadChangelog();
  </script>
</body>

</html>
